<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrainBoost Quiz App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Welcome Screen -->
    <div class="container" id="welcomeScreen">

        <div class="card">

            <h1>🧠 BrainBoost</h1>

            <p class="tagline">
                Challenge Yourself. One Question at a Time.
            </p>

            <input
                type="text"
                id="username"
                placeholder="Enter Your Name">

            <button id="startBtn">
                Continue
            </button>

        </div>

    </div>

    <!-- Category Screen -->
    <div class="container hidden" id="categoryScreen">

        <div class="card">

            <h1>Choose a Category</h1>

            <p class="tagline" id="categoryGreeting">Pick a topic to begin</p>

            <div id="categoryGrid" class="category-grid"></div>

        </div>

    </div>

    <!-- Quiz Screen -->
    <div class="container hidden" id="quizScreen">

        <div class="card">

            <div class="top">

                <h2 id="welcomeText"></h2>

                <p id="progress"></p>

            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

            <span id="categoryTag" class="category-tag"></span>

            <h2 id="question"></h2>

            <div id="options"></div>

            <button id="nextBtn" disabled>
                Next
            </button>

        </div>

    </div>

    <!-- Result Screen -->
    <div class="container hidden" id="resultScreen">

        <div class="card">

            <h1>🎉 Quiz Completed!</h1>

            <h2 id="finalMessage"></h2>

            <h3 id="finalScore"></h3>

            <p id="bestScoreText"></p>

            <button id="changeCategoryBtn">
                Try Another Category
            </button>

            <button id="restartBtn">
                Restart Quiz
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
